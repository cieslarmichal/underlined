services:
  localstack:
    image: localstack/localstack
    container_name: underlined-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://127.0.0.1:4566
      DEBUG: 1
      DOCKER_HOST: unix:///var/run/docker.sock
      DATA_DIR: /tmp/localstack/data
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./docker/localstack/create-bucket.sh:/etc/localstack/init/ready.d/create-bucket.sh"

  database-postgres:
    image: postgres:17
    container_name: underlined-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - underlined-pgdata:/var/lib/postgresql/data

volumes:
  underlined-pgdata:
