# fly.toml app configuration file generated for underlined-frontend on 2026-11-01T22:32:16+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'underlined-frontend'
primary_region = 'fra'

[build]
  dockerfile = './Dockerfile'
  build-target = 'static'

  [build.args]
    VITE_BACKEND_URL = 'https://api.underlined.dev'

[deploy]
  strategy = 'rolling'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1000
    soft_limit = 500

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
