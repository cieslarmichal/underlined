server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;

    # Security headers
    include /etc/nginx/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # The document that names every hashed asset must never be cached, otherwise a client holding
    # a stale index.html asks for chunks a new deploy has removed. SPA routes land here through
    # the try_files fallback below.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        # A location that sets any add_header of its own inherits none from its parent, so the
        # security headers have to be repeated in every block that adds one.
        include /etc/nginx/security-headers.conf;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";

            include /etc/nginx/security-headers.conf;
        }
    }
}
