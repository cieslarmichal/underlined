# fly.toml app configuration file generated for underlined-backend on 2026-11-01T22:33:11+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'underlined-backend'
primary_region = 'fra'

[build]
  dockerfile = './Dockerfile'
  build-target = 'runner'

[deploy]
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  NODE_EXTRA_CA_CERTS = '/app/certs/db-ca.crt'

[[files]]
  guest_path = '/app/certs/db-ca.crt'
  secret_name = 'DB_CA_CERT'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 150
    soft_limit = 100

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
